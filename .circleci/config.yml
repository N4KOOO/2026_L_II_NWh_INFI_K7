version: 2.1

jobs:
  build-and-test:
    machine:
      image: ubuntu-2004:current

    steps:
      - checkout

      - run:
          name: deps
          command: make deps

      - run:
          name: lint
          command: make lint

      - run:
          name: test
          command: make test

      - run:
          name: docker_build
          command: docker build -t sample-app .

      - run:
          name: docker_push
          command: echo "Docker push"

workflows:
  basic:
    jobs:
      - build-and-test